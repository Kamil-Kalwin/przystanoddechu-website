<div class="page">
    @if (currentTravel()) {
        <h2>{{currentTravel()?.name}}</h2>
        @for (part of currentTravel()?.content; track $index) {
            <div class="part">
                <h3>{{part.title}}</h3>
                <div class="text">{{part.text}}</div>
                <div class="gallery">
                    @for (image of part.images; track $index; let i = $index) {
                        <div class="image" (click)="openViewer(i)">
                            <img [src]="'assets/images/'+image">
                        </div>
                    }
                </div>
            </div>
        }
    }
    
</div>

@if (isViewerOpen()) {
    <image-viewer (onClose)="close()" [activeIdx]="activeImageIdx()" [images]="viewerImages()"></image-viewer>
}
