<div class="word-cloud">

  @for (item of items(); track item.id) {

    <span
      class="word"
      [style.left.%]="item.x"
      [style.top.%]="item.y"
      [style.fontSize.px]="item.size"
      [style]="{'--text-color': item.color}"
      [style.animationDuration.s]="item.duration"
      [style.--rotation]="item.rotation + 'deg'"
    >
      {{ item.text }}
    </span>

  }

</div>
